notes: |
  Shipped by an unattended agent session (no human present; ADR-and-proceed rule
  in effect — see below). Branch: w1/fe-app-mock-server, pushed to origin, no PR
  opened per this session's push-only rule.

  What shipped:
  - docs/adr/ADR-009-mock-tooling.md (PROPOSED): MSW (browser+node) for the
    in-app mock layer; Prism via `pnpm dlx @stoplight/prism-cli` (not installed
    as a dependency) for a standalone contract-only mock server; Vitest +
    Testing Library + jsdom + ajv + @apidevtools/swagger-parser for tests.
  - app/mock/{fixtures,handlers,browser,node}.ts: all 8 contract operations
    served, seeded from /fixtures/ golden files. /auth/github and /auth/me have
    no golden fixtures (none exist in /fixtures/), so their payloads are
    synthesized locally in app/mock/fixtures.ts and clearly commented as such.
  - Types come from the generated @kyndro/types package (contract/types),
    not hand-rolled interfaces — added as a workspace dependency.
  - app/flags/index.ts: mock/live flag, defaults to mock (VITE_API_MODE=live
    is the escape hatch; no live implementation exists yet, by design).
  - app/screens/RunList + RunDetail: minimal dashboard using @kyndro/design-system
    (Table, StatusChip, Button, CodeBlock). Each screen has explicit loading,
    empty, and error states, verified in app/tests/ui/*.test.tsx via MSW
    server.use() overrides and the ?scenario= query param convention.
  - DiffViewerShell (design-system) is deliberately NOT used yet: the contract
    gives us a Counterexample (property/expected/actual/replay), not diff
    lines, and fabricating fake diff content felt dishonest for a tool whose
    whole premise is honest verdicts. Counterexamples render as text via
    CodeBlock instead. Flagging this as a judgment call for human review.
  - app/tests/contract/mock-responses.test.ts: dereferences
    contract/openapi.yaml with swagger-parser and validates every mocked
    response against its schema with ajv, for all 8 operations.

  Verification run (all green): `tsc --noEmit`, `vitest run` (14/14 passed:
  8 contract + 6 UI), `vite build` (clean prod build), manual `vite` dev-server
  smoke check (index.html, main.tsx, mock/browser.ts, mockServiceWorker.js all
  serve/transform correctly).

  Flagged for human review:
