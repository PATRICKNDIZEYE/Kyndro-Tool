    merged, so both branches independently used ADR-008 vs this branch's
    ADR-009. Needs renumbering/reconciliation at merge time.
  - Root pnpm-workspace.yaml / package.json were independently (re)created on
    both unmerged W1 branches — expect a trivial merge conflict, reconcile to
    one copy.
  - This branch pulled app/design-system from w1/fe-sys-tokens-components into
    its working tree temporarily (read-only, for local typecheck/build) and
    removed it again before this commit — it is NOT part of this commit or
    branch. Until both branches merge, this branch cannot stand alone (its
    @kyndro/design-system workspace dependency won't resolve on a fresh
    checkout) — this is expected for two territory-scoped branches that both
    touch the same monorepo pre-merge, not a bug in either packet.
  - Diff is ~1314 lines (excluding pnpm-lock.yaml), over the PLAN.md §4.3
    400-line PR cap — same situation as W1-SYS-1: this is a from-scratch
